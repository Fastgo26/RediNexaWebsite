 <div style="background:#ffffff; padding:25px; border-radius:16px; margin-top:30px; box-shadow:0 5px 20px rgba(0,0,0,0.07);">

  <h2 style="margin-top:0; color:#111827;">Send Us a Message</h2>

  <form action="mailto:contact@redinexa.com" method="post" enctype="text/plain">

    <label for="name" style="display:block; margin-bottom:6px; font-weight:600;">
      Name
    </label>

    <input
      type="text"
      id="name"
      name="Name"
      required
      style="width:100%; padding:12px; margin-bottom:18px; border:1px solid #d1d5db; border-radius:8px;"
    >

    <label for="email" style="display:block; margin-bottom:6px; font-weight:600;">
      Email
    </label>

    <input
      type="email"
      id="email"
      name="Email"
      required
      style="width:100%; padding:12px; margin-bottom:18px; border:1px solid #d1d5db; border-radius:8px;"
    >

    <label for="message" style="display:block; margin-bottom:6px; font-weight:600;">
      Message
    </label>

    <textarea
      id="message"
      name="Message"
      rows="6"
      required
      style="width:100%; padding:12px; margin-bottom:18px; border:1px solid #d1d5db; border-radius:8px; resize:vertical;"
    ></textarea>

    <button
      type="submit"
      style="background:#2563eb; color:white; border:none; padding:12px 24px; border-radius:8px; font-weight:700; cursor:pointer;"
    >
      Send Message
    </button>

  </form>

</div>
