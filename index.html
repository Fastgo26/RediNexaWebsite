  <style>
    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: #111827;
      background: #f5f7fb;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav-container {
      max-width: 1450px;
      margin: auto;
      padding: 20px 35px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 30px;
    }

    .logo {
      font-size: 34px;
      font-weight: 800;
      color: #1769ff;
      white-space: nowrap;
    }

    nav {
      display: flex;
      flex-wrap: wrap;
      gap: 25px;
      align-items: center;
    }

    nav a {
      color: #111827;
      font-weight: 700;
      font-size: 17px;
    }

    nav a:hover {
      color: #1769ff;
    }

    /* GENERAL */
    section {
      padding: 75px 25px;
    }

    .container {
      max-width: 1300px;
      margin: auto;
    }

    .section-title {
      text-align: center;
      font-size: 42px;
      margin: 0 0 15px;
      font-weight: 800;
    }

    .section-subtitle {
      text-align: center;
      max-width: 800px;
      margin: 0 auto 45px;
      color: #4b5563;
      font-size: 19px;
    }

    /* HERO */
    .hero {
      background: linear-gradient(135deg, #eaf2ff, #ffffff);
      padding: 100px 25px;
    }

    .hero-content {
      max-width: 1100px;
      margin: auto;
      text-align: center;
    }

    .hero h1 {
      font-size: 58px;
      line-height: 1.1;
      margin: 0 0 25px;
      font-weight: 900;
    }

    .hero h1 span {
      color: #1769ff;
    }

    .hero p {
      max-width: 800px;
      margin: 0 auto 35px;
      font-size: 21px;
      color: #4b5563;
    }

    .hero-buttons {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-block;
      background: #1769ff;
      color: white;
      padding: 14px 24px;
      border-radius: 10px;
      font-size: 17px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
      background: #0d57dc;
    }

    .btn-secondary {
      background: white;
      color: #1769ff;
      border: 2px solid #1769ff;
    }

    .btn-secondary:hover {
      background: #eef4ff;
    }

    /* CARDS */
    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      border: 1px solid #e5e7eb;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .card h3 {
      margin-top: 0;
      font-size: 25px;
    }

    .card p {
      color: #4b5563;
    }

    .icon {
      font-size: 38px;
      margin-bottom: 10px;
    }

    /* PRODUCTS */
    #products {
      background: white;
    }

    /* TRAVEL */
    #travel {
      background: #edf4ff;
    }

    .travel-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 28px;
    }

    .travel-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      border: 1px solid #dfe7f5;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
    }

    .travel-card h3 {
      font-size: 25px;
      margin: 5px 0 15px;
    }

    .travel-card p {
      color: #4b5563;
      min-height: 70px;
    }

    /* DEALS */
    #deals {
      background: #fff8e9;
    }

    .deal-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 28px;
    }

    .deal-card {
      background: white;
      border-radius: 18px;
      padding: 30px;
      border: 1px solid #eadfca;
      box-shadow: 0 8px 25px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
    }

    .deal-card h3 {
      font-size: 26px;
      margin: 5px 0 15px;
    }

    .deal-card p {
      color: #4b5563;
      flex-grow: 1;
    }

    .deal-badge {
      display: inline-block;
      width: fit-content;
      background: #fff0d0;
      color: #9a5b00;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 800;
      margin-bottom: 12px;
    }

    /* APPS */
    #apps {
      background: white;
    }

    /* SERVICES */
    #services {
      background: #f3f6fa;
    }

    /* ABOUT */
    #about {
      background: white;
    }

    .about-box {
      max-width: 950px;
      margin: auto;
      text-align: center;
    }

    .about-box p {
      font-size: 18px;
      color: #4b5563;
    }

    /* AFFILIATE NOTICE */
    .affiliate-notice {
      max-width: 1000px;
      margin: 50px auto 0;
      padding: 20px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      text-align: center;
      color: #4b5563;
      font-size: 14px;
    }

    /* FOOTER */
    footer {
      background: #111827;
      color: white;
      padding: 45px 25px;
    }

    .footer-container {
      max-width: 1300px;
      margin: auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr;
      gap: 40px;
    }

    footer h3 {
      margin-top: 0;
      font-size: 22px;
    }

    footer p {
      color: #d1d5db;
    }

    footer a {
      color: #d1d5db;
      display: block;
      margin-bottom: 8px;
    }

    footer a:hover {
      color: white;
    }

    .copyright {
      max-width: 1300px;
      margin: 35px auto 0;
      padding-top: 20px;
      border-top: 1px solid #374151;
      text-align: center;
      color: #9ca3af;
      font-size: 14px;
    }

    /* MOBILE */
    @media (max-width: 1000px) {

      .travel-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .cards,
      .deal-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 45px;
      }

      .footer-container {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 700px) {

      .nav-container {
        flex-direction: column;
        padding: 18px 15px;
